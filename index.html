<title>Training Schedule Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen workbench. Left rail = block library, patterns, project details. Right = week grid that mirrors the printed page. */
:root{
  --bg:#EDF1F6; --panel:#FFFFFF; --panel-2:#F4F7FB; --ink:#142030; --ink-2:#4A5C73; --ink-3:#74869B;
  --line:#D5DDE8; --line-soft:#E6ECF3; --accent:#1F62A8; --accent-ink:#FFFFFF; --accent-soft:#DDEAF7;
  --danger:#B3303A; --danger-soft:#FBE3E5; --ok:#23744A; --hl:rgba(31,98,168,.07);
  --shadow:0 1px 2px rgba(20,32,48,.08),0 10px 28px rgba(20,32,48,.14);
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151D; --panel:#16202B; --panel-2:#1B2734; --ink:#E7EDF5; --ink-2:#A3B3C6; --ink-3:#7C8DA2;
  --line:#2A394A; --line-soft:#223040; --accent:#6BA8E8; --accent-ink:#0B1622; --accent-soft:#1E3550;
  --danger:#F0838B; --danger-soft:#3A1E24; --ok:#6CCB97; --hl:rgba(107,168,232,.09);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151D; --panel:#16202B; --panel-2:#1B2734; --ink:#E7EDF5; --ink-2:#A3B3C6; --ink-3:#7C8DA2;
  --line:#2A394A; --line-soft:#223040; --accent:#6BA8E8; --accent-ink:#0B1622; --accent-soft:#1E3550;
  --danger:#F0838B; --danger-soft:#3A1E24; --ok:#6CCB97; --hl:rgba(107,168,232,.09);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:6px;height:32px;padding:0 8px;min-width:0}
input[type=checkbox]{height:auto;width:16px;height:16px;accent-color:var(--accent)}
input:hover,select:hover{border-color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.muted{color:var(--ink-3)}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:34px;width:auto;display:block}
.brand .sep{width:1px;height:28px;background:var(--line)}
.pname{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.pname b{font-size:14px;font-weight:600}
.pname span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.spacer{flex:1}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:6px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel-2);border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.danger{color:var(--danger)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn[disabled]{opacity:.38;cursor:default;pointer-events:none}
.btn svg{width:16px;height:16px;flex:none}

/* layout */
.main{display:grid;grid-template-columns:316px minmax(0,1fr);min-height:0}
.side{position:relative;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding-left:max(0px,env(safe-area-inset-left,0px))}
.tabs{display:flex;position:sticky;top:0;background:var(--panel);z-index:3;border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:40px;border:0;background:none;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.sbody{padding:14px 16px 28px;display:flex;flex-direction:column;gap:18px}
.sec h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.sec .hint{margin:0 0 10px;font-size:12px;color:var(--ink-2)}
.pals{display:flex;flex-direction:column;gap:6px}
.pal{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.pal:hover{border-color:var(--accent);background:var(--panel-2)}
.pal .sw{width:12px;height:26px;border-radius:2px;border:1px solid rgba(0,0,0,.4);flex:none}
.pal .nm{font-weight:500;font-size:13px;line-height:1.2;min-width:0}
.pal .du{margin-left:auto;font:12px var(--mono);color:var(--ink-3);white-space:nowrap;padding-left:6px}
.pal .grip{color:var(--ink-3);flex:none;width:14px;height:14px}
.prow{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);width:100%;text-align:left}
.prow.on{border-color:var(--accent);background:var(--accent-soft)}
.prow .x{margin-left:auto;border:0;background:none;color:var(--ink-3);padding:2px;display:flex}
.prow .x:hover{color:var(--danger)}
.prow small{color:var(--ink-3);font:12px var(--mono);margin-left:auto;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{min-width:44px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-weight:500;font-size:12px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stack{display:flex;flex-direction:column;gap:6px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f>span{font-size:12px;color:var(--ink-2)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sec.form{display:flex;flex-direction:column;gap:10px}
#trash{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:var(--danger-soft);color:var(--danger);font-weight:600;border:2px dashed var(--danger)}
body.trash #trash{display:flex}
#trash svg{width:28px;height:28px}

/* stage */
.stage{overflow:auto;padding-block:14px 40px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wtabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.wtab{height:36px;padding:0 14px;border:1px solid var(--line);background:var(--panel);border-radius:6px;display:flex;flex-direction:column;justify-content:center;line-height:1.15;text-align:left}
.wtab b{font-weight:600;font-size:13px}
.wtab span{font-size:11px;color:var(--ink-3)}
.wtab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wtab.on span{color:inherit;opacity:.85}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-left:auto}
.tool{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{height:28px;padding:0 10px;border:0;background:var(--panel);font-size:12px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.tool select{height:28px;font-size:12px;padding:0 4px}
.status{font-size:12px;display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
.status.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent;font-weight:500}
.wset{display:grid;grid-template-columns:minmax(200px,1.1fr) 150px minmax(220px,2fr) auto;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.banner{background:#FFF200;color:#C00000;font-weight:600;font-style:italic;border-color:#d8cc00}
.gridwrap{min-width:0}
.sched{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:760px}
.hdr{position:sticky;top:-14px;z-index:6;background:var(--panel);display:grid;grid-template-columns:92px repeat(5,minmax(0,1fr));border-bottom:2px solid var(--ink-3);border-radius:8px 8px 0 0}
.hl{display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;color:var(--ink-2);border-top:1px solid var(--line-soft);border-right:1px solid var(--line)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 4px 0 6px;height:36px;border-right:1px solid var(--line);background:var(--panel-2);border-radius:0}
.dh .dname{border:0;background:none;font-weight:600;font-size:13px;padding:6px 4px;border-radius:4px;text-align:left;flex:1;min-width:0}
.dh.active{box-shadow:inset 0 -3px 0 var(--accent)}
.dh.active .dname{color:var(--accent)}
.dh .kebab{border:0;background:none;width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.dh .kebab:hover{background:var(--line-soft)}
.dd{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;border-top:1px solid var(--line-soft);border-right:1px solid var(--line);height:26px;font-variant-numeric:tabular-nums}
.dc{border-top:1px solid var(--line-soft);border-right:1px solid var(--line);padding:3px 4px;display:flex}
.dc input{width:100%;height:28px;border-color:transparent;background:transparent;text-align:center;font-size:12.5px}
.dc input:hover{background:var(--panel-2)}
.dc input:focus{background:var(--panel);border-color:var(--accent)}
.dc.em input{font-style:italic;font-weight:500}
.hl.tall,.dc.tall{height:36px}
.body{display:grid;grid-template-columns:92px minmax(0,1fr)}
.gut{position:relative;border-right:1px solid var(--line)}
.gl{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font:11px var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.gl.hr{color:var(--ink);font-weight:500}
.layer{position:relative;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line-soft) 1px,transparent 1px);background-size:20% 100%,100% calc(var(--row)*2),100% var(--row);touch-action:pan-y}
.layer .hlday{position:absolute;top:0;bottom:0;width:20%;background:var(--hl);pointer-events:none}
.blk{position:absolute;border:1px solid rgba(15,25,38,.55);border-radius:3px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px 6px;overflow:hidden;color:#12202E;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;line-height:1.2}
.blk:hover{box-shadow:0 0 0 2px var(--accent-soft)}
.blk .bt{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;max-width:100%;pointer-events:none}
.blk .bn{font-weight:600;font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.blk .btm{font:11px var(--mono);opacity:.85;white-space:nowrap}
.blk.compact .bt{flex-direction:row;gap:6px;white-space:nowrap}
.blk.compact .bn{font-size:12px}
.blk.dark{color:#fff}
.blk.plain{background:repeating-linear-gradient(135deg,transparent 0 9px,var(--line-soft) 9px 10px);border:1px dashed var(--ink-3);color:var(--ink-2)}
.blk.plain .bn{font-weight:500;font-size:14px;white-space:normal;overflow:visible}
.blk.sel{outline:2px solid var(--accent);outline-offset:1px;z-index:3}
.blk.conflict{border-color:var(--danger);box-shadow:0 0 0 2px var(--danger)}
.blk.lift{box-shadow:var(--shadow);z-index:8;opacity:.94}
.blk .h{position:absolute;z-index:2}
.blk .h.ht,.blk .h.hb{left:0;right:0;height:8px;cursor:ns-resize}
.blk .h.ht{top:0}.blk .h.hb{bottom:0}
.blk .h.hr{top:0;bottom:0;right:0;width:8px;cursor:ew-resize}
.blk.sel .h.hb::after,.blk:hover .h.hb::after{content:"";position:absolute;left:50%;bottom:2px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:currentColor;opacity:.45}
.blk.sel .h.hr::after,.blk:hover .h.hr::after{content:"";position:absolute;right:2px;top:50%;height:22px;width:3px;margin-top:-11px;border-radius:2px;background:currentColor;opacity:.45}
#preview{position:absolute;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:3px;opacity:.85;pointer-events:none;z-index:7}
#preview.bad{border-color:var(--danger);background:var(--danger-soft)}
.dragghost{position:fixed;z-index:60;pointer-events:none;padding:6px 10px;border-radius:6px;font-weight:600;font-size:12.5px;border:1px solid rgba(15,25,38,.55);box-shadow:var(--shadow);color:#12202E;transform:translate(10px,10px)}
.emptyhint{position:absolute;left:50%;top:40px;transform:translateX(-50%);text-align:center;color:var(--ink-3);pointer-events:none;max-width:360px}
.emptyhint b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}

/* popovers */
.pop,.insp{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:10px;max-width:calc(100vw - 16px)}
.pop{min-width:220px}
.insp{width:272px;display:flex;flex-direction:column;gap:10px}
.insp .hd{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.insp .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.insp select,.insp input[type=text]{width:100%}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:24px;height:24px;border-radius:5px;border:1px solid rgba(0,0,0,.4);padding:0}
.swatch.on{outline:2px solid var(--accent);outline-offset:2px}
.swatch.auto{background:repeating-linear-gradient(45deg,var(--panel) 0 4px,var(--line) 4px 5px)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.menu{display:flex;flex-direction:column;min-width:210px}
.menu button{height:34px;padding:0 10px;border:0;background:none;text-align:left;display:flex;align-items:center;gap:8px;border-radius:5px}
.menu button:hover{background:var(--panel-2)}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.menu svg{width:16px;height:16px;color:var(--ink-3)}
.pop .opt{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer}
.pop .opt input{margin-top:3px;height:auto}
.pop .opt.on{border-color:var(--accent);background:var(--accent-soft)}
.pop .warn{font-size:12px;color:var(--danger);margin:6px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px)}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:600;text-decoration:underline;padding:0}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}

@media (max-width:1100px){.wset{grid-template-columns:1fr 150px}.wset .wide{grid-column:1/-1}}
@media (max-width:860px){
  html,body{height:auto}.app{height:auto;display:block}
  .main{display:block}.side{border-right:0;border-bottom:1px solid var(--line);max-height:none}
  .stage{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .gridwrap{overflow-x:auto}.hdr{position:static}
  #saved{display:none}.brand .sep,.pname{display:none}
}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.prow,.pal{transition:background .12s,border-color .12s}}
</style>

/* ---------- dates ---------- */
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var pd=function(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var addD=function(s,n){var d=pd(s);if(!d)return '';d.setDate(d.getDate()+n);return iso(d)};
var ord=function(n){return n+((n%100>=11&&n%100<=13)?'th':(['th','st','nd','rd'][n%10]||'th'))};
var longDate=function(s){var d=pd(s);return d?MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear():''};
var shortDate=function(s){var d=pd(s);return d?MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate():''};
var ordDate=function(d){return MONTHS[d.getMonth()]+' '+ord(d.getDate())};
var slashDate=function(s){var d=pd(s);return d?(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear():''};
var FALLBACK_DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday'];
function dayName(w,i){var d=pd(addD(w.start,i));return d?WD[d.getDay()]:FALLBACK_DAYS[i]}
function nextMonday(){var d=new Date();d.setDate(d.getDate()+(((8-d.getDay())%7)||7));return iso(d)}
function trainLines(P){var a=pd(P.trainStart),b=pd(P.trainEnd);if(a&&b){if(a.getFullYear()===b.getFullYear())return [ordDate(a),'through',ordDate(b),String(a.getFullYear())];return [ordDate(a)+', '+a.getFullYear(),'through',ordDate(b)+', '+b.getFullYear()]}var d=a||b;return d?[ordDate(d)+', '+d.getFullYear()]:[]}
function goLines(P){var d=pd(P.goLive);return d?[WD[d.getDay()]+',',ordDate(d)+',',String(d.getFullYear())]:[]}

/* ---------- state ---------- */
var P,hist=[],hi=-1,lastKey='',lastT=0,saveTimer=null;
var weekIdx=0,sel=null,inspOpen=false,activeDay=1,tab='build',fillSel=[1,2,3],patSel='A',exportScope='all';
var UI={row:28};
try{var u=JSON.parse(localStorage.getItem(LS_UI)||'null');if(u&&u.row)UI.row=u.row}catch(e){}
var W=function(){return P.weeks[weekIdx]};
var res=function(b){return b.full?{s:P.range[0],e:P.range[1]}:{s:b.start,e:b.end}};
var allPatterns=function(){return BUILTIN.concat(P.patterns||[])};

function fix(){
  var d=blank();for(var k in d)if(P[k]==null)P[k]=d[k];
  ['primary','alternate','lead'].forEach(function(k){P[k]=Object.assign({},d[k],P[k])});
  if(!Array.isArray(P.range)||P.range.length!==2)P.range=[T(7),T(19)];
  P.snap=P.snap===15?15:30;
  if(!Array.isArray(P.patterns))P.patterns=[];
  if(!Array.isArray(P.weeks)||!P.weeks.length)P.weeks=[blankWeek(nextMonday())];
  P.weeks.forEach(function(w){
    w.id=w.id||uid();w.title=w.title||'';w.notes=w.notes||'';if(!pd(w.start))w.start=nextMonday();
    w.days=[0,1,2,3,4].map(function(i){var x=(w.days||[])[i]||{};return {room:x.room||'',am:x.am||'',pm:x.pm||''}});
    w.blocks=(w.blocks||[]).filter(function(b){return TYPES[b.type]}).map(function(b){
      b.id=b.id||uid();b.day=clamp(+b.day||0,0,4);b.span=clamp(+b.span||1,1,5-b.day);b.start=+b.start||0;b.end=+b.end||b.start+30;if(TYPES[b.type].plain)b.full=true;
      if(b.title==null)b.title=TYPES[b.type].name;return b});
    w.blocks.forEach(function(b){if(!b.full){if(b.start<P.range[0])P.range[0]=Math.floor(b.start/30)*30;if(b.end>P.range[1])P.range[1]=Math.ceil(b.end/30)*30}});
  });
  weekIdx=clamp(weekIdx,0,P.weeks.length-1);
  if(sel&&!W().blocks.some(function(b){return b.id===sel}))sel=null;
}
function snapshot(key){
  var s=JSON.stringify(P),now=Date.now();
  if(key&&key===lastKey&&now-lastT<1500&&hi>=0&&hi===hist.length-1){hist[hi]=s}
  else{hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>150)hist.shift();hi=hist.length-1}
  lastKey=key||'';lastT=now;
}
function touch(key){snapshot(key);schedSave();renderStatus()}
function schedSave(){
  $('#saved').textContent='Saving…';clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{localStorage.setItem(LS_KEY,JSON.stringify(P));var d=new Date();$('#saved').textContent='Saved in this browser at '+clock(d.getHours()*60+d.getMinutes())}
    catch(e){$('#saved').textContent='Not saved in this browser. Use File > Save project file.'}
  },350)
}
function undo(){if(hi>0){hi--;P=JSON.parse(hist[hi]);lastKey='';fix();renderAll();schedSave()}}
function redo(){if(hi<hist.length-1){hi++;P=JSON.parse(hist[hi]);lastKey='';fix();renderAll();schedSave()}}

/* ---------- block helpers ---------- */
function conflictIds(w){
  var ids={};var bl=w.blocks;
  for(var i=0;i<bl.length;i++)for(var j=i+1;j<bl.length;j++){var a=bl[i],b=bl[j];
    if(a.day+a.span<=b.day||b.day+b.span<=a.day)continue;
    var ra=res(a),rb=res(b);if(ra.s<rb.e&&rb.s<ra.e){ids[a.id]=1;ids[b.id]=1}}
  return ids}
function hits(tmp,ignore){return W().blocks.some(function(o){if(o.id===ignore)return false;if(tmp.day+tmp.span<=o.day||o.day+o.span<=tmp.day)return false;var r=res(o),s=tmp.full?P.range[0]:tmp.start,e=tmp.full?P.range[1]:tmp.end;return r.s<e&&s<r.e})}
function mergeSwaps(w){
  var groups={};
  w.blocks.forEach(function(b){if(TYPES[b.type].merge){var k=b.type+'|'+b.start+'|'+b.end+'|'+b.title+'|'+(b.fill||'');(groups[k]=groups[k]||[]).push(b)}});
  Object.keys(groups).forEach(function(k){
    var g=groups[k].sort(function(a,b){return a.day-b.day});var cur=g[0];
    for(var i=1;i<g.length;i++){var n=g[i];
      if(cur.day+cur.span===n.day){cur.span+=n.span;w.blocks=w.blocks.filter(function(x){return x!==n})}else cur=n}
  })}
function cutDay(w,d){
  var out=[];
  w.blocks.forEach(function(b){
    if(d<b.day||d>=b.day+b.span){out.push(b);return}
    if(b.span===1)return;
    if(d>b.day){var l=JSON.parse(JSON.stringify(b));l.id=uid();l.span=d-b.day;out.push(l)}
    if(d<b.day+b.span-1){var r=JSON.parse(JSON.stringify(b));r.id=uid();r.day=d+1;r.span=b.day+b.span-1-d;out.push(r)}
  });w.blocks=out}
function nextFree(day,span,dur){
  var bl=W().blocks.filter(function(b){return !(b.day+b.span<=day||day+span<=b.day)});
  var lo=Math.max(P.range[0],Math.min(T(8),P.range[1]-dur));
  for(var s=lo;s+dur<=P.range[1];s+=P.snap){if(!bl.some(function(b){var r=res(b);return r.s<s+dur&&s<r.e}))return s}
  return lo}
function addBlock(type,day,start){
  var t=TYPES[type],span=t.span||1;day=clamp(day,0,5-span);
  var dur=t.dur||(P.range[1]-P.range[0]);
  if(start==null)start=nextFree(day,span,dur);
  start=clamp(start,P.range[0],Math.max(P.range[0],P.range[1]-dur));
  var b=mkBlock(type,day,start,start+dur);b.span=span;
  if(type==='custom')b.fill=SWATCH[4];
  W().blocks.push(b);sel=b.id;inspOpen=false;activeDay=day;
  touch('add');renderAll();return b}
function delBlock(id){var w=W();w.blocks=w.blocks.filter(function(b){return b.id!==id});if(sel===id){sel=null;inspOpen=false}touch('del');renderAll()}
function dupBlock(id){var b=W().blocks.filter(function(x){return x.id===id})[0];if(!b)return;
  var c=JSON.parse(JSON.stringify(b));c.id=uid();
  if(!c.full){var dur=c.end-c.start;var s=nextFree(c.day,c.span,dur);if(s+dur<=P.range[1]&&!hits({day:c.day,span:c.span,start:c.end,end:c.end+dur},null)&&c.end+dur<=P.range[1])s=c.end;c.start=s;c.end=s+dur}
  else if(c.day<4-c.span+1)c.day=Math.min(4,c.day+1);
  W().blocks.push(c);sel=c.id;touch('dup');renderAll()}

/* ---------- toast & popover ---------- */
var toastT=null;
function toast(msg,action,fn){
  var t=$('#toast');t.hidden=false;t.innerHTML='<span>'+esc(msg)+'</span>'+(action?'<button type="button" id="toastAct">'+esc(action)+'</button>':'');
  if(action)$('#toastAct').onclick=function(){fn();t.hidden=true};
  clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},action?6000:3200)}
function openPop(anchor,html,mount,align){
  var p=$('#pop');p.hidden=false;p.innerHTML=html;p._anchor=anchor;
  var r=anchor.getBoundingClientRect();p.style.left='0px';p.style.top='0px';
  var w=p.offsetWidth,h=p.offsetHeight;
  var x=align==='right'?r.right-w:r.left;x=clamp(x,8,innerWidth-w-8);
  var y=r.bottom+6;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);
  p.style.left=x+'px';p.style.top=y+'px';if(mount)mount(p)}
function closePop(){$('#pop').hidden=true}
document.addEventListener('pointerdown',function(e){
  var p=$('#pop');if(!p.hidden&&!p.contains(e.target)&&!(p._anchor&&p._anchor.contains(e.target)))closePop();
  var i=$('#insp');if(!i.hidden&&!i.contains(e.target)&&!e.target.closest('.blk')&&!e.target.closest('#pop')&&!e.target.closest('.pal')){inspOpen=false;positionInspector()}

function geoStyle(b){
  var ROW=UI.row,r=res(b);
  var top=(r.s-P.range[0])/30*ROW,h=(r.e-r.s)/30*ROW;
  return 'left:calc('+(b.day*20)+'% + 2px);width:calc('+(b.span*20)+'% - 4px);top:'+(top+1)+'px;height:'+Math.max(10,h-2)+'px'}
function blockHTML(b,bad){

  var cls='blk'+(t.plain?' plain':'')+(isDark(b)?' dark':'')+(b.id===sel?' sel':'')+(bad?' conflict':'')+(h<44?' compact':'');

   +(t.plain?'':'<i class="h ht"></i>')+'<i class="h hb" style="'+(t.plain?'display:none':'')+'"></i><i class="h hr"></i></div>'}

function applyInspector(field,val,el){

  else if(field==='type'){var old=TYPES[b.type];if(!b.title||b.title===old.name)b.title=TYPES[val].name;b.type=val;

  touch('insp'+field+b.id);renderAll();renderInspector()}

function onMove(e){
  if(!D)return;

    var t2=TYPES[D.type],span=t2.span||1,dur=t2.dur||(P.range[1]-P.range[0]);

    var over=document.elementFromPoint(e.clientX,e.clientY);var trash=!!(over&&over.closest('.side'));
    document.body.classList.toggle('trash',trash);D.trash=trash;
    var day2=clamp(Math.floor(g.x/g.dayW)-D.grabCol,0,5-b.span);
    var dur2=b.end-b.start,st2=b.start;
    if(!b.full){st2=clamp(snapR(yMin(g,g.y)-D.grabMin),P.range[0],P.range[1]-dur2)}

}
function autoScroll(e){

function copyDay(d,targets){
  var w=W();var src=w.blocks.filter(function(b){return b.day<=d&&d<b.day+b.span}).map(function(b){return JSON.parse(JSON.stringify(b))});
  if(!src.length){toast('That day has no blocks to copy.');return}

  targets.forEach(function(t){cutDay(w,t);src.forEach(function(b){var c=JSON.parse(JSON.stringify(b));c.id=uid();c.day=t;c.span=1;w.blocks.push(c)});
    var td=w.days[t];['room','am','pm'].forEach(function(k){if(!td[k]&&di[k])td[k]=di[k]})});
  mergeSwaps(w);touch('copyday');closePop();renderAll();toast('Copied '+dayName(w,d)+' to '+targets.length+' day'+(targets.length>1?'s':''),'Undo',undo)}
function fillDays(id,days){
  var p=allPatterns().filter(function(x){return x.id===id})[0];if(!p||!days.length)return;var w=W();
  days.forEach(function(d){cutDay(w,d)});
  days.forEach(function(d){p.blocks.forEach(function(r){var b=mkBlock(r.type,d,r.start,r.end);if(r.title)b.title=r.title;if(r.fill)b.fill=r.fill;if(r.showTime===false)b.showTime=false;w.blocks.push(b)})});
  mergeSwaps(w);sel=null;inspOpen=false;touch('fill');renderAll();toast('Filled '+days.length+' day'+(days.length>1?'s':'')+' with "'+p.name+'"','Undo',undo)}
function scheduleSpan(){var min=null,max=null;P.weeks.forEach(function(w){w.blocks.forEach(function(b){if(TYPES[b.type].plain)return;for(var d=b.day;d<b.day+b.span;d++){var s=addD(w.start,d);if(!min||s<min)min=s;if(!max||s>max)max=s}})});return [min,max]}

function fileMenu(){
  openPop($('#fileBtn'),'<div class="menu"><button type="button" data-fm="new">'+ic('file')+'New blank schedule</button><button type="button" data-fm="open">'+ic('open')+'Open project file…</button><button type="button" data-fm="save">'+ic('save')+'Save project file</button><hr><button type="button" data-fm="ex">'+ic('pat')+'Load Geisinger example</button></div>',function(p){
    p.onclick=function(e){var b=e.target.closest('[data-fm]');if(!b)return;var a=b.dataset.fm;closePop();
      if(a==='new'){load(blank());toast('Started a blank schedule','Undo',undo)}
      if(a==='ex'){load(example());toast('Loaded the Geisinger example','Undo',undo)}
      if(a==='open')$('#file').click();
      if(a==='save')saveProject()}},'right')}
function load(np){P=np;weekIdx=0;sel=null;inspOpen=false;fix();touch('load');renderAll()}
function readFile(f){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.weeks))throw 0;load(o);toast('Opened '+f.name)}catch(e){toast('That file is not a schedule project file.')}};r.readAsText(f)}
function fname(ext){var n=(P.hospital||'Training Schedule').replace(/\s*\([^)]*\)\s*/g,' ').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,' ');return 'Training Schedule - '+n+'.'+ext}
function getDownloads(){
  if(window.claude&&window.claude.use)return window.claude.use('downloads').catch(function(){return null});
  /* Standalone page (GitHub Pages, local file): save through a normal browser download. */
  return Promise.resolve({save:function(r){return new Promise(function(ok,fail){try{
    var type=/\.pdf$/i.test(r.filename)?'application/pdf':'application/json';
    var url=URL.createObjectURL(new Blob([r.data],{type:type}));var a=document.createElement('a');a.href=url;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},4000);ok({status:'saved'})}catch(e){fail({code:'unavailable'})}})}})}
function saveProject(){getDownloads().then(function(dl){
  if(!dl){toast('Downloads are not available in this view. Open the artifact in Claude to save files.');return}
  dl.save({filename:fname('json'),data:JSON.stringify(P,null,2)}).then(function(){toast('Project file saved')},function(er){if(er&&er.code!=='declined')toast('Could not save the file.')})})}

/* ---------- export ---------- */
function exportPop(){
  var n=P.weeks.length,bad=0;P.weeks.forEach(function(w){bad+=Object.keys(conflictIds(w)).length});
  function opts(){return '<label class="opt'+(exportScope==='all'?' on':'')+'"><input type="radio" name="scope" value="all"'+(exportScope==='all'?' checked':'')+'><span><b>All weeks</b><br><span class="muted">'+n+' page'+(n>1?'s':'')+', one per week</span></span></label>'
    +'<label class="opt'+(exportScope==='this'?' on':'')+'"><input type="radio" name="scope" value="this"'+(exportScope==='this'?' checked':'')+'><span><b>Week '+(weekIdx+1)+' only</b><br><span class="muted">1 page</span></span></label>'}
  openPop($('#exportBtn'),'<div style="width:290px"><div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px">Export PDF · Letter, portrait</div><div id="scopes">'+opts()+'</div>'
    +(bad?'<div class="warn">'+bad+' blocks overlap and will print on top of each other.</div>':'')
    +'<button type="button" class="btn primary" id="goExport" style="width:100%;justify-content:center;margin-top:4px">'+ic('dl')+'Download PDF</button></div>',function(p){
    p.onchange=function(e){if(e.target.name==='scope'){exportScope=e.target.value;$('#scopes').innerHTML=opts()}};
    $('#goExport').onclick=function(){doExport()}},'right')}
function doExport(){
  var btn=$('#goExport');if(btn){btn.disabled=true;btn.textContent='Building PDF…'}
  setTimeout(function(){
    try{
      if(!window.jspdf){throw new Error('The PDF library did not load. Check your connection and reload.')}
      var weeks=exportScope==='this'?[W()]:P.weeks;var doc=buildPDF(weeks);var buf=doc.output('arraybuffer');
      getDownloads().then(function(dl){
        if(!dl){closePop();toast('Downloads are not available in this view. Open the artifact in Claude to export.');return}
        return dl.save({filename:fname('pdf'),data:buf}).then(function(){closePop();toast('PDF saved ('+weeks.length+' page'+(weeks.length>1?'s':'')+')')},function(er){closePop();if(er&&er.code==='declined')return;toast('Could not save the PDF ('+(er&&er.code||'error')+').')})})
    }catch(er){closePop();toast(er.message||'PDF export failed.')}
  },30)}

/* ---------- PDF drawing (vector, letter portrait, mirrors the Geisinger template) ---------- */
var S=function(s){return String(s==null?'':s).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/[^\x09\x0A\x20-\x7E\xA0-\xFF]/g,'')};
function fitSize(doc,s,maxW,size,min){doc.setFontSize(size);while(size>min&&doc.getTextWidth(s)>maxW){size-=0.25;doc.setFontSize(size)}return size}
function cellText(doc,s,x,y,w,h,o){
  s=S(s);if(!s)return;o=Object.assign({size:8,font:'normal',align:'center',color:'#111111',min:5,pad:3},o||{});
  doc.setFont('helvetica',o.font);var sz=fitSize(doc,s,w-2*o.pad,o.size,o.min);doc.setTextColor(o.color);
  var tx=o.align==='center'?x+w/2:o.align==='left'?x+o.pad:x+w-o.pad;
  doc.text(s,tx,y+h/2+sz*0.34,{align:o.align});return sz}
function wrapCell(doc,s,x,y,w,h,o){
  s=S(s);if(!s)return;o=Object.assign({size:9,font:'normal',color:'#111111',min:5,pad:3,lh:1.2,align:'center'},o||{});
  doc.setFont('helvetica',o.font);var sz=o.size,lines;
  for(;;){doc.setFontSize(sz);lines=doc.splitTextToSize(s,w-2*o.pad);var ok=lines.length*sz*o.lh<=h-2;if(ok||sz<=o.min)break;sz-=0.25}
  doc.setTextColor(o.color);var tot=lines.length*sz*o.lh;var y0=y+(h-tot)/2+sz*0.92;
  lines.forEach(function(l,i){doc.text(l,o.align==='left'?x+o.pad:x+w/2,y0+i*sz*o.lh,{align:o.align})})}
function drawBlock(doc,b,x,y,w,h){
  var t=TYPES[b.type],title=S(b.title||t.name);var r=res(b);
  if(t.plain){wrapCell(doc,title,x,y,w,h,{size:11,min:7});return}
  var fill=fillOf(b);doc.setFillColor(fill);doc.setDrawColor('#1b2430');doc.setLineWidth(0.7);doc.rect(x,y,w,h,'FD');
  var col=lum(fill)<0.45?'#FFFFFF':'#111111';doc.setTextColor(col);
  var time=b.showTime!==false?'('+hhmm(r.s)+'-'+hhmm(r.e)+')':'';var sep=t.sep||' ';
  var size=8.2,lh=1.2;
  if(h>=size*lh*2+3&&time){
    var lines,sz=size;
    for(;;){doc.setFont('helvetica','bold');doc.setFontSize(sz);lines=doc.splitTextToSize(title,w-6);var total=(lines.length+1)*sz*lh;if((total<=h-3&&lines.every(function(l){return doc.getTextWidth(l)<=w-4}))||sz<=5)break;sz-=0.25}
    var tot=(lines.length+1)*sz*lh,y0=y+(h-tot)/2+sz*0.92;
    lines.forEach(function(l,i){doc.setFont('helvetica','bold');doc.setFontSize(sz);doc.text(l,x+w/2,y0+i*sz*lh,{align:'center'})});
    doc.setFont('helvetica','normal');doc.setFontSize(sz);doc.text(time,x+w/2,y0+lines.length*sz*lh,{align:'center'});return}
  if(h>=size*lh+2.5&&!time){wrapCell(doc,title,x,y,w,h,{size:size,font:'bold',color:col,min:5});return}
  // single line: bold title + lighter time
  var sz2=size;
  for(;;){doc.setFont('helvetica','bold');doc.setFontSize(sz2);var w1=doc.getTextWidth(title);doc.setFont('helvetica','normal');doc.setFontSize(sz2*0.88);var w2=time?doc.getTextWidth(sep+time):0;if(w1+w2<=w-4||sz2<=4.5)break;sz2-=0.25}
  doc.setFont('helvetica','bold');doc.setFontSize(sz2);var w1b=doc.getTextWidth(title);
  doc.setFont('helvetica','normal');doc.setFontSize(sz2*0.88);var w2b=time?doc.getTextWidth(sep+time):0;
  var sx=x+(w-(w1b+w2b))/2,by=y+h/2+sz2*0.34;
  doc.setFont('helvetica','bold');doc.setFontSize(sz2);doc.text(title,sx,by);
  if(time){doc.setFont('helvetica','normal');doc.setFontSize(sz2*0.88);doc.text(sep+time,sx+w1b,by)}}
function buildPDF(weeks){
  var jsPDF=window.jspdf.jsPDF;var doc=new jsPDF({unit:'pt',format:'letter',orientation:'portrait',compress:true});
  doc.setProperties({title:'Training Schedule - '+S(P.hospital),author:S(P.preparedBy)||'ZOLL Clinical Education'});
  weeks.forEach(function(w,i){if(i)doc.addPage();drawWeek(doc,w)});return doc}
function drawWeek(doc,w){
  var X0=36,TW=540,G=61,D=(TW-G)/5,LC='#1b2430',top=121,PAGE_B=742;
  var tint='#E8EEF4',green='#EBF1DE',dayFill='#DCEAF4';
  function box(x,y,ww,hh,fill,lw){doc.setLineWidth(lw||0.55);doc.setDrawColor(LC);if(fill){doc.setFillColor(fill);doc.rect(x,y,ww,hh,'FD')}else doc.rect(x,y,ww,hh,'S')}
  doc.addImage(LOGO,'PNG',X0,14,112,70.3,'zoll-cet-logo');
  // banner
  var bx=X0+G+D,bw=3*D;box(bx,top-22,bw,22,'#FFF200',0.6);
  cellText(doc,w.title,bx,top-22,bw,22,{size:14,font:'bolditalic',color:'#C00000',min:8});
  var R={hosp:15,addr:15,dev:13,ch:13,nm:13,em:13,ph:13,lead:22,note:22,dh:24,date:14,room:12,am:24,pm:24};
  var Y={};var y=top;['hosp','addr','dev','ch','nm','em','ph','lead','note','dh','date','room','am','pm'].forEach(function(k){Y[k]=y;y+=R[k]});
  var gridTop=y,infoBottom=Y.dh,LX=X0+G,VX=LX+D,VW=4*D,H2=2*D;
  // hospital rows
  [['hosp','Hospital Name:',P.hospital,true],['addr','Address:',P.address,true]].forEach(function(r){
    box(LX,Y[r[0]],D,R[r[0]],null);box(VX,Y[r[0]],VW,R[r[0]],tint);
    cellText(doc,r[1],LX,Y[r[0]],D,R[r[0]],{size:9.5,font:'bold'});cellText(doc,r[2],VX,Y[r[0]],VW,R[r[0]],{size:10.5,align:'left',pad:5,min:7})});
  box(LX,Y.dev,D,R.dev,null);box(VX,Y.dev,VW,R.dev,null);
  cellText(doc,'Device to Train:',LX,Y.dev,D,R.dev,{size:7.5,font:'bold'});cellText(doc,P.device,VX,Y.dev,VW,R.dev,{size:8,align:'left',pad:5});
  // contacts
  box(LX,Y.ch,D,R.ch,null);box(VX,Y.ch,H2,R.ch,null);box(VX+H2,Y.ch,H2,R.ch,null);
  cellText(doc,'Hospital Contact(s):',LX,Y.ch,D,R.ch,{size:7.5,font:'bold'});
  ['Primary:','Alternate:'].forEach(function(l,i){var cx=VX+i*H2;cellText(doc,l,cx,Y.ch,H2,R.ch,{size:8,font:'bold'});doc.setFont('helvetica','bold');doc.setFontSize(8);var tw=doc.getTextWidth(l);doc.setLineWidth(0.5);doc.setDrawColor('#111');doc.line(cx+H2/2-tw/2,Y.ch+R.ch/2+4,cx+H2/2+tw/2,Y.ch+R.ch/2+4)});
  var rows=[['nm','Name:',function(c){return c.name+(c.title?' - '+c.title:'')},tint],['em','Email:',function(c){return c.email},tint],['ph','Phone:',function(c){return c.phone},null]];
  rows.forEach(function(r){box(LX,Y[r[0]],D,R[r[0]],null);cellText(doc,r[1],LX,Y[r[0]],D,R[r[0]],{size:7.5});
    [P.primary,P.alternate].forEach(function(c,i){var cx=VX+i*H2;box(cx,Y[r[0]],H2,R[r[0]],r[3]);var txt=r[2](c);
      if(r[0]==='em'&&txt){cellText(doc,txt,cx,Y[r[0]],H2,R[r[0]],{size:7.5,align:'left',pad:4,color:'#1155CC'});doc.setFontSize(7.5);var tw2=Math.min(doc.getTextWidth(S(txt)),H2-8);doc.link(cx+4,Y[r[0]],tw2,R[r[0]],{url:'mailto:'+S(txt)})}
      else cellText(doc,txt,cx,Y[r[0]],H2,R[r[0]],{size:r[0]==='nm'?9:7.5,align:'left',pad:4,min:6})})});
  box(LX,Y.lead,D,R.lead,tint);box(VX,Y.lead,VW,R.lead,tint);
  cellText(doc,'Clinical Project Lead:',LX,Y.lead,D,R.lead,{size:7.5,font:'bold'});
  var lead=[P.lead.name,P.lead.email,P.lead.phone].filter(Boolean).join(' - ');cellText(doc,lead,VX,Y.lead,VW,R.lead,{size:10.5,align:'left',pad:5,color:'#1F4E9A',min:7});
  box(LX,Y.note,D,R.note,null);box(VX,Y.note,VW,R.note,null);
  cellText(doc,'Items to Note:',LX,Y.note,D,R.note,{size:7.5,font:'bold'});
  wrapCell(doc,w.notes,VX,Y.note,VW,R.note,{size:10,min:6,pad:5,align:'left'});
  // sidebar (training dates / go-live)
  var sbH=(Y.date-top);
  box(X0,top,G,16,green);cellText(doc,'Training Dates:',X0,top,G,16,{size:7,font:'bold'});
  var td=trainLines(P);box(X0,top+16,G,52,null);
  doc.setFont('helvetica','normal');td.forEach(function(l,i){cellText(doc,l,X0,top+16+(52-td.length*11)/2+i*11,G,11,{size:8.6,min:6})});
  box(X0,top+68,G,26,green);cellText(doc,'Estimated Go',X0,top+68,G,13,{size:7,font:'bold'});cellText(doc,'Live Date:',X0,top+81,G,13,{size:7,font:'bold'});
  var gl=goLines(P),gh=sbH-94;box(X0,top+94,G,gh,null);
  gl.forEach(function(l,i){cellText(doc,l,X0,top+94+(gh-gl.length*11)/2+i*11,G,11,{size:8.6,min:6})});
  // day header + date rows
  var cols=[0,1,2,3,4].map(function(i){return X0+G+i*D});
  // plain full-height blocks can merge upward over the room/educator cells
  var merged={};w.blocks.forEach(function(b){var dd=w.days[b.day];if(TYPES[b.type].plain&&b.span===1&&!dd.room&&!dd.am&&!dd.pm)merged[b.day]=b});
  for(var i=0;i<5;i++){
    box(cols[i],Y.dh,D,R.dh,dayFill);cellText(doc,dayName(w,i),cols[i],Y.dh,D,R.dh,{size:8,font:'bold'});
    box(cols[i],Y.date,D,R.date,null);cellText(doc,longDate(addD(w.start,i)),cols[i],Y.date,D,R.date,{size:7.6,font:'bold'});
    if(!merged[i]){
      box(cols[i],Y.room,D,R.room,null);cellText(doc,w.days[i].room,cols[i],Y.room,D,R.room,{size:7.6,font:'bold'});
      box(cols[i],Y.am,D,R.am,null);cellText(doc,w.days[i].am,cols[i],Y.am,D,R.am,{size:8,font:'bolditalic'});
      box(cols[i],Y.pm,D,R.pm,null);cellText(doc,w.days[i].pm,cols[i],Y.pm,D,R.pm,{size:8,font:'bolditalic'})}}
  [['date','Date',R.date],['room','Room Location',R.room]].forEach(function(r){box(X0,Y[r[0]],G,r[2],null);cellText(doc,r[1],X0,Y[r[0]],G,r[2],{size:6.8,font:'bold'})});
  box(X0,Y.am,G,R.am,null);cellText(doc,'ZOLL AM',X0,Y.am,G,12,{size:6.8,font:'bold'});cellText(doc,'Educator',X0,Y.am+10,G,12,{size:6.8,font:'bold'});
  box(X0,Y.pm,G,R.pm,null);cellText(doc,'ZOLL PM',X0,Y.pm,G,12,{size:6.8,font:'bold'});cellText(doc,'Educator',X0,Y.pm+10,G,12,{size:6.8,font:'bold'});
  // time grid
  var n=(P.range[1]-P.range[0])/30,rowH=Math.min(17,(PAGE_B-gridTop)/n),gridBottom=gridTop+n*rowH;
  doc.setLineWidth(0.3);
  for(var r=0;r<n;r++){var ry=gridTop+r*rowH,m=P.range[0]+r*30;box(X0,ry,G,rowH,null,0.35);cellText(doc,clock(m),X0,ry,G,rowH,{size:7.2,font:m%60?'normal':'bold'})}
  // faint hour lines in day area
  doc.setDrawColor('#DDE2E8');doc.setLineWidth(0.3);
  for(r=0;r<=n;r++){if((P.range[0]+r*30)%60===0&&r>0&&r<n){var ly=gridTop+r*rowH;doc.line(X0+G,ly,X0+TW,ly)}}
  for(i=1;i<5;i++){doc.setDrawColor('#9AA5B1');doc.setLineWidth(0.35);doc.line(cols[i],gridTop,cols[i],gridBottom)}
  // merged plain blocks (travel / breakdown), drawn from the Room row down
  Object.keys(merged).forEach(function(k){var x=cols[+k];box(x,Y.room,D,gridBottom-Y.room,'#FFFFFF',0.55);wrapCell(doc,merged[k].title,x,Y.room,D,gridBottom-Y.room,{size:11,min:7})});
  // blocks
  var Rm=function(b){return res(b)};
  w.blocks.slice().sort(function(a,b){return Rm(a).s-Rm(b).s}).forEach(function(b){
    if(merged[b.day]===b)return;var r2=Rm(b);
    var bx2=cols[b.day]+0.4,bw2=b.span*D-0.8,by2=gridTop+(r2.s-P.range[0])/30*rowH+0.4,bh2=(r2.e-r2.s)/30*rowH-0.8;
    drawBlock(doc,b,bx2,by2,bw2,bh2)});
  // outer frame
  doc.setDrawColor(LC);doc.setLineWidth(1);doc.rect(X0,top,TW,gridBottom-top,'S');
  doc.setLineWidth(0.8);doc.line(X0+G,Y.dh,X0+TW,Y.dh);doc.line(X0,Y.date,X0+TW,Y.date);
  // footer stamp
  var stamp=[P.preparedBy,slashDate(P.preparedDate)].filter(Boolean).join(' ');
  doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor('#555555');doc.text(S(stamp),X0+TW,gridBottom+11,{align:'right'})}

/* ---------- boot ---------- */
function boot(){
  var loaded=null;
  try{var raw=localStorage.getItem(LS_KEY);if(raw){var o=JSON.parse(raw);if(o&&Array.isArray(o.weeks))loaded=o}}catch(e){}
  P=loaded||example();fix();snapshot('init');
  renderAll();$('#saved').textContent=loaded?'Restored from this browser':'Example loaded';
  window.__app={get P(){return P},get weekIdx(){return weekIdx},buildPDF:buildPDF};
}
boot();
})();
</script>
